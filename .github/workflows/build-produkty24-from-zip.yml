name: Build Produkty24 APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build-produkty24-from-zip.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Nie znaleziono pliku ZIP w głównym katalogu repo."
            exit 1
          fi
          echo "Znaleziono: $ZIP_FILE"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/produkty24"
          mkdir -p "$RUNNER_TEMP/produkty24"
          unzip -q "${{ steps.zip.outputs.file }}" -d "$RUNNER_TEMP/produkty24"

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          SETTINGS="$(find "$RUNNER_TEMP/produkty24" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "Nie znaleziono settings.gradle/settings.gradle.kts w ZIP-ie."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Projekt Android: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find "${{ steps.project.outputs.dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "Build zakończony, ale nie znaleziono APK."
            exit 1
          fi

          echo "APK: $APK"
          echo "file=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nocna-Zmiana-Produkty24-APK
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 30
